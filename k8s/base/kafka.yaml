# Kafka managed by the Strimzi operator (scripts/install-operators.ps1).
# Single node in KRaft mode acting as both controller and broker; clients use
# the bootstrap service "wqa-kafka-bootstrap:9092".
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: wqa
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        kraftMetadata: shared
        deleteClaim: true
  resources:
    requests: { memory: 768Mi, cpu: 250m }
    limits: { memory: 1Gi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: wqa
spec:
  kafka:
    version: 4.2.2
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Topics are declared below as KafkaTopic resources, not created on first use.
      auto.create.topics.enable: false
      log.retention.hours: 24
  entityOperator:
    topicOperator:
      resources:
        requests: { memory: 192Mi, cpu: 50m }
        limits: { memory: 320Mi }
---
# Topics, managed declaratively by Strimzi's topic operator.
# 3 partitions: up to 3 consumers per group (KEDA scales the workers on lag).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: questions
  labels: { strimzi.io/cluster: wqa }
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: urls
  labels: { strimzi.io/cluster: wqa }
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: chunks-ready
  labels: { strimzi.io/cluster: wqa }
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: events
  labels: { strimzi.io/cluster: wqa }
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 3600000   # UI progress events are only needed for a short while
