# Our Python services. All share one image (wqa-app:dev), different entrypoints.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wqa-config
data:
  KAFKA_BOOTSTRAP: "kafka:9092"
  QDRANT_URL: "http://qdrant:6333"
  SEARXNG_URL: "http://searxng:8080"
  # Ollama runs on the Windows host (GPU); Docker Desktop routes this name to it.
  OLLAMA_URL: "http://host.docker.internal:11434"
  LLM_MODEL: "qwen3:8b"
  EMBED_MODEL: "qwen3-embedding:0.6b"
  EMBED_DIM: "1024"
  MAX_URLS: "8"
  ANSWER_DEADLINE_S: "40"
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector: { app: api }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, part-of: wqa-app }
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: wqa-app:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: wqa-config } }]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 384Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searcher
spec:
  replicas: 1
  selector:
    matchLabels: { app: searcher }
  template:
    metadata:
      labels: { app: searcher, part-of: wqa-app }
    spec:
      enableServiceLinks: false
      containers:
        - name: searcher
          image: wqa-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.searcher.main"]
          envFrom: [{ configMapRef: { name: wqa-config } }]
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcher
spec:
  # 3 replicas x 3 partitions on the "urls" topic = pages fetched in parallel.
  replicas: 3
  selector:
    matchLabels: { app: fetcher }
  template:
    metadata:
      labels: { app: fetcher, part-of: wqa-app }
    spec:
      enableServiceLinks: false
      containers:
        - name: fetcher
          image: wqa-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.fetcher.main"]
          envFrom: [{ configMapRef: { name: wqa-config } }]
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: answerer
spec:
  replicas: 1
  selector:
    matchLabels: { app: answerer }
  template:
    metadata:
      labels: { app: answerer, part-of: wqa-app }
    spec:
      enableServiceLinks: false
      containers:
        - name: answerer
          image: wqa-app:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.answerer.main"]
          envFrom: [{ configMapRef: { name: wqa-config } }]
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 256Mi }
