# Self-hosted metasearch engine: no API key, no tracking, JSON output enabled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: wqa-search
    server:
      secret_key: "local-dev-only-not-secret"
      limiter: false
      image_proxy: false
      public_instance: false
    search:
      safe_search: 0
      formats: [html, json]
      # Defaults suspend an engine for up to 1h (CAPTCHA) after one block; with several
      # engines in rotation, a short pause is enough.
      suspended_times:
        SearxEngineAccessDenied: 120
        SearxEngineCaptcha: 600
        SearxEngineTooManyRequests: 120
    outgoing:
      request_timeout: 4.0
      max_request_timeout: 8.0
    # Spread queries over more engines so no single one rate-limits us.
    # (Tested 2026-11: bing, yahoo, yandex, mwmbl answer; duckduckgo/brave CAPTCHA under load.)
    engines:
      - name: bing
        disabled: false
      - name: yahoo
        disabled: false
      - name: yandex
        disabled: false
      - name: mwmbl
        disabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
spec:
  selector: { app: searxng }
  ports:
    - { name: http, port: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels: { app: searxng }
  template:
    metadata:
      labels: { app: searxng }
    spec:
      enableServiceLinks: false
      containers:
        - name: searxng
          image: searxng/searxng:2026.10.19-81371861f
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: settings, mountPath: /etc/searxng/settings.yml, subPath: settings.yml }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 512Mi }
      volumes:
        - name: settings
          configMap: { name: searxng-settings }
