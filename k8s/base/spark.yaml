# Spark Structured Streaming fetcher, run by the Spark Operator (scripts/install-operators.ps1).
# The operator submits the job in cluster mode; the driver pod then asks the Kubernetes API
# for executor pods, hence the RBAC for its service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: [create, get, list, watch, delete, deletecollection, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
subjects:
  - { kind: ServiceAccount, name: spark }
roleRef:
  { apiGroup: rbac.authorization.k8s.io, kind: Role, name: spark-driver }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-checkpoints
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: wqa-fetcher
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: wqa-spark:dev
  imagePullPolicy: Always   # same tag every build: always re-resolve to the newest local image
  mainApplicationFile: local:///app/services/spark_fetcher/job.py
  sparkVersion: 4.1.3
  # A streaming job should run forever: resubmit it whenever it stops.
  restartPolicy:
    type: Always
    onFailureRetryInterval: 10
    onSubmissionFailureRetryInterval: 20
  sparkConf:
    spark.sql.shuffle.partitions: "4"
    spark.ui.showConsoleProgress: "false"
  volumes:
    - name: checkpoints
      persistentVolumeClaim: { claimName: spark-checkpoints }
  driver:
    cores: 1
    coreRequest: 250m
    memory: 512m
    memoryOverhead: 384m
    serviceAccount: spark
    labels: { part-of: wqa-spark }
    envFrom: [{ configMapRef: { name: wqa-config } }]
    podSecurityContext: { fsGroup: 185 }   # 185 = spark user in the image
    volumeMounts:
      - { name: checkpoints, mountPath: /checkpoints }
  executor:
    instances: 2
    cores: 1
    coreRequest: 250m
    memory: 512m
    memoryOverhead: 512m
    labels: { part-of: wqa-spark }
    envFrom: [{ configMapRef: { name: wqa-config } }]
---
# Spark UI: kubectl -n wqa port-forward svc/spark-ui 4040:4040
apiVersion: v1
kind: Service
metadata:
  name: spark-ui
spec:
  selector:
    sparkoperator.k8s.io/app-name: wqa-fetcher
    spark-role: driver
  ports:
    - { name: http, port: 4040 }
